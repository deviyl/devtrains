<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deviyl's Trains</title>
    <link rel="icon" type="image/png" href="/kfc/images/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-header">
        <h1>Deviyl's Trains</h1>
        <hr>
    </div>
    <div class="main-container">

        <div class="info-card standing-card">
            <div class="card-header">
                <span class="card-title">Where we're at</span>
            </div>
            <div class="card-body card-body--column">
                <div class="hero-figure" id="hero-progress">0 / 9</div>
                <p class="hero-caption">trains logged this cycle</p>
                <div id="hero-dots" class="hero-dots" aria-hidden="true"></div>

                <dl class="stat-list">
                    <div class="stat-row">
                        <dt>Trains received</dt>
                        <dd id="stat-total-trains">—</dd>
                    </div>
                    <div class="stat-row">
                        <dt>Days trained</dt>
                        <dd id="stat-days-trained">—</dd>
                    </div>
                    <div class="stat-row">
                        <dt>Cycles earned</dt>
                        <dd id="stat-cycles-earned">—</dd>
                    </div>
                    <div class="stat-row">
                        <dt>Cycles paid</dt>
                        <dd id="stat-cycles-paid">—</dd>
                    </div>
                    <div class="stat-row stat-row--owed">
                        <dt>Owed right now</dt>
                        <dd id="stat-owed">—</dd>
                    </div>
                </dl>
                <p class="stat-note">9 days of trains = 5 xanax</p>
            </div>
        </div>

        <div class="cards-grid">

            <div class="info-card">
                <div class="card-header">
                    <span class="card-title">The Trains</span>
                </div>
                <div class="card-body card-body--column">
                    <span class="card-description" id="trains-count-note"></span>
                    <div id="trains-list" class="entry-list">
                        <p class="empty-note">Loading…</p>
                    </div>
                </div>
            </div>

            <div class="info-card">
                <div class="card-header">
                    <span class="card-title">The Payments</span>
                </div>
                <div class="card-body card-body--column">
                    <span class="card-description" id="payments-count-note"></span>
                    <div id="payments-list" class="entry-list">
                        <p class="empty-note">Loading…</p>
                    </div>
                </div>
            </div>

        </div>

        <div class="refresh-bar">
            <button id="refresh-btn" type="button">Refresh</button>
            <p id="refresh-status" class="refresh-status">—</p>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
